source: >-
  Public package-registry searches plus a GitHub organization search, 2026-08-08. Also checked
  the whole boundlessbio.com surface for an SDK, client-library or download page.
note: >-
  Boundless Bio ships no client library, no SDK and no CLI — it publishes no product API to
  wrap, and it runs no developer program. There is also no GitHub organization: github.com/
  boundlessbio, github.com/boundless-bio and github.com/BoundlessBio all return 404, so unlike
  many clinical-stage biotechs Boundless Bio publishes no first-party research code either. Its
  scientific output is distributed as journal papers and conference posters (linked from
  https://boundlessbio.com/publications/ and served as PDFs out of the WordPress media library),
  not as software. Absence is the finding here; nothing was authored to fill the gap, and NO
  SDKs pointer is wired in apis.yml because there is no SDK to point at.
