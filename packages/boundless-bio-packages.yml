adjacent_software:
  note: >-
    Boundless Bio does describe proprietary software in its own materials — ECHO, an algorithm
    that detects ecDNA from routine clinical next-generation sequencing data, which the company
    calls the first ecDNA diagnostic used in clinical trials, and the Spyglass discovery
    platform. Neither is distributed, downloadable, licensable through any public channel, or
    reachable over an API. They are recorded here as context only, and are deliberately NOT
    listed as packages.
