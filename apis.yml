apis:
- aid: boundless-bio:content
  name: Boundless Bio Content API (WordPress REST wp/v2)
  description: 'The anonymously readable WordPress REST API that boundlessbio.com serves at
    /wp-json/wp/v2 — the corporate pages (9 published), the `who-we-are` Leadership custom post
    type (27 published, categorized as Board of Directors, Leadership and Scientific / Clinical
    Advisors), the media library (255 items), taxonomies and a site-wide search endpoint, all as
    JSON with page/per_page pagination and X-WP-Total / X-WP-TotalPages headers. Page bodies are
    empty on the `content` field and are instead served in full through the public `acf` object
    (Advanced Custom Fields flexible-content `modules`), so the page copy is machine-readable but
    only under `acf`. This is the CMS content API, not a Boundless Bio product API; Boundless Bio
    publishes no OpenAPI for it, so the definition in this repo was derived mechanically from the
    live route-discovery document at https://boundlessbio.com/wp-json/.'
  humanURL: https://boundlessbio.com/who-we-are/
  baseURL: https://boundlessbio.com/wp-json/wp/v2
