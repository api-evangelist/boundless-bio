aid: boundless-bio
name: Boundless Bio
description: 'Boundless Bio (Nasdaq: BOLD) is a San Diego, California based clinical-stage,
  next-generation precision oncology company founded in 2018 to target extrachromosomal DNA
  (ecDNA) — circular, centromere-free DNA that carries high copy-number oncogene amplifications
  and is observed in roughly 17% of cancer patients, driving tumor heterogeneity and resistance
  to targeted therapy. Its proprietary Spyglass discovery platform, built on a suite of ecDNA+/-
  tumor models plus molecular analytics and imaging, identifies targets essential to ecDNA
  function, which the company drugs with small-molecule ecDNA-directed therapies (ecDTx). The
  clinical pipeline is led by BBI-940, a kinesin inhibitor targeting ecDNA segregation, in the
  Phase 1 KOMODO-1 trial in ER+/HER2- and TNBC-LAR breast cancer opened in February 2026, with
  earlier CHK1 (replication stress) and RNR (DNA assembly and repair) programs behind it; ECHO,
  its ecDNA diagnostic algorithm, reads ecDNA off routine clinical next-generation sequencing
  and is described by the company as the first ecDNA diagnostic used in clinical trials.
  Boundless Bio raised a $100M Series C co-led by Leaps by Bayer and RA Capital and listed on
  Nasdaq in 2024. It publishes no developer program, no product API, no SDKs and no API
  documentation of any kind; the only machine-readable surface on boundlessbio.com is the
  WordPress REST API (wp/v2), anonymously readable, which serves the corporate pages, the
  Leadership directory and the media library as JSON.'
